<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Scorers Window — phone Go Live with Play-Cricket score overlay" />
  <title>Scorers Window</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <a href="#/" class="brand" aria-label="Scorers Window home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Scorers Window</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/go-live" data-nav="go-live">Go Live</a>
        <a href="#/setup" data-nav="setup">Setup</a>
        <a href="#/watch" data-nav="watch">Live feed</a>
        <a href="#/obs" data-nav="obs" class="nav-advanced">Overlay setup</a>
      </nav>
    </header>
    <main id="main" class="main" role="main"></main>
    <footer class="footer" id="footer">
      <span>Phone → pick game → Go Live</span>
      <span id="hub-status" class="hub-status">—</span>
    </footer>
  </div>

  <script src="/js/demo.js" defer></script>
  <script src="/js/hub.js" defer></script>
  <script src="/js/overlay.js" defer></script>
  <script src="/js/stream.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>

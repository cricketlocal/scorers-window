# Scorers Window — web service (static app + YouTube RTMP relay)
# Requires Docker (ffmpeg). Blueprint: connect repo and apply.

services:
  - type: web
    name: scorers-window
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_STREAM_SESSIONS
        value: "3"
      # Optional override (default YouTube primary ingest)
      # - key: YT_RTMP_BASE
      #   value: rtmp://a.rtmp.youtube.com/live2
